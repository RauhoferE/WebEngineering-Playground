server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off; # no nginx version in the Server header

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Overwrite, never append ($proxy_add_x_forwarded_for): otherwise anyone picks their own rate-limit key
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    # The CSP against stored XSS belongs on the document, and nginx serves index.html
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://upload.wikimedia.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri $uri/ /index.html;
  }
}
