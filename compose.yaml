services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bears}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bears}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bears}
    volumes:
      - pgdata:/var/lib/postgresql
    ports: ['5432:5432']
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3000'
      APP_VERSION: '0.1.0'
      WIKIPEDIA_BASE_URL: https://en.wikipedia.org
      USER_AGENT: 'BearApp/0.1 (https://github.com/RauhoferE/WebEngineering-Playground)'
      UPSTREAM_TIMEOUT_MS: '5000'
      CORS_ORIGINS: http://localhost:4173
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bears}
      REPORT_MODE: ${REPORT_MODE:-locked}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TRUST_PROXY: uniquelocal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ['3000:3000']
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:80']
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bears}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env} # loadEnv() requires it; the worker doesn't use it
      JOB_VISIBILITY_TIMEOUT_SECONDS: ${JOB_VISIBILITY_TIMEOUT_SECONDS:-300}
      WORKER_DEMO_DELAY_MS: ${WORKER_DEMO_DELAY_MS:-0}
    healthcheck:
      disable: true # the image's HEALTHCHECK probes :3000, which the worker doesn't serve
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
