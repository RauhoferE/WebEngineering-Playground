services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bears}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bears}
      POSTGRES_DB: ${POSTGRES_DB:-bears}
    volumes:
      - pgdata:/var/lib/postgresql
    ports: ['5432:5432']
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3000'
      APP_VERSION: '0.1.0'
      WIKIPEDIA_BASE_URL: https://en.wikipedia.org
      USER_AGENT: 'BearApp/0.1 (https://github.com/RauhoferE/WebEngineering-Playground)'
      UPSTREAM_TIMEOUT_MS: '5000'
      CORS_ORIGINS: http://localhost:4173
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ['3000:3000']
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:80']
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
