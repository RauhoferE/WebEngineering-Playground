name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: a secret that was removed later is still leaked
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Install strictly from package-lock.json (must come first: every later step needs node_modules)
      - run: npm ci
      # Typecheck without emmiting files
      - run: npm run typecheck
      # Transpile and bundle application in dist folder
      - run: npm run build
      # Run lint check
      - run: npm run lint
      # Run prettier check
      - run: npm run format:check
      # Run tests (in-memory repositories, so no database needed in CI)
      - run: npm test
