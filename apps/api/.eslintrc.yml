root: true
env:
  node: true
  es2022: true
parser: '@typescript-eslint/parser'
parserOptions:
  project: true
  sourceType: module
extends:
  - standard-with-typescript
  - plugin:@typescript-eslint/recommended
  - plugin:prettier/recommended
  - prettier
ignorePatterns:
  - dist
  - node_modules
  # drizzle-kit tooling config, outside tsconfig's "src" and never part of the build
  - drizzle.config.ts
rules:
  # const Bear (zod schema) + type Bear is intentional; tsc catches real redeclarations
  '@typescript-eslint/no-redeclare': off
